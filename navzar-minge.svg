<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9e48"/>
      <stop offset="1" stop-color="#16692b"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#b9b9b9"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.28" r="0.3">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="400" cy="400" r="300"/></clipPath>
    <g id="sector">
      <polygon points="400,220 480.8,161.3 450,66.2 350,66.2 319.2,161.3" fill="#1a1a1a"/>
      <line x1="400" y1="310" x2="400" y2="220"/>
      <line x1="480.8" y1="161.3" x2="602" y2="249.4"/>
    </g>
  </defs>

  <!-- fundal: iarba cu dungi -->
  <rect width="800" height="800" fill="url(#grass)"/>
  <g fill="#ffffff" opacity="0.06">
    <rect x="0" y="0" width="100" height="800"/>
    <rect x="200" y="0" width="100" height="800"/>
    <rect x="400" y="0" width="100" height="800"/>
    <rect x="600" y="0" width="100" height="800"/>
  </g>

  <!-- umbra mingii -->
  <ellipse cx="410" cy="725" rx="230" ry="28" fill="#000" opacity="0.3"/>

  <!-- mingea -->
  <circle cx="400" cy="400" r="300" fill="url(#shade)"/>
  <g clip-path="url(#ball)" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round">
    <polygon points="400,310 485.6,372.2 452.9,472.8 347.1,472.8 314.4,372.2" fill="#1a1a1a"/>
    <use xlink:href="#sector"/>
    <use xlink:href="#sector" transform="rotate(72 400 400)"/>
    <use xlink:href="#sector" transform="rotate(144 400 400)"/>
    <use xlink:href="#sector" transform="rotate(216 400 400)"/>
    <use xlink:href="#sector" transform="rotate(288 400 400)"/>
  </g>
  <circle cx="400" cy="400" r="300" fill="url(#gloss)"/>
  <circle cx="400" cy="400" r="300" fill="none" stroke="#1a1a1a" stroke-width="6"/>

  <!-- textul -->
  <g transform="rotate(-8 400 420)">
    <rect x="130" y="345" width="540" height="150" rx="22" fill="#e53935" stroke="#ffffff" stroke-width="8"/>
    <text x="400" y="420" text-anchor="middle" dominant-baseline="central"
          font-family="Impact, 'Arial Black', sans-serif" font-size="130" letter-spacing="6"
          fill="#ffd600" stroke="#1a1a1a" stroke-width="10" paint-order="stroke" stroke-linejoin="round">NAVZAR</text>
  </g>
</svg>
